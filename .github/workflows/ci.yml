name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: occa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || (echo "Unformatted files:"; echo "$unformatted"; exit 1)

      - name: Lint
        env:
          LINT_BASE_REV: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD^' }}
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --new-from-rev="$LINT_BASE_REV" ./...

      - name: Tuning literal gate
        run: |
          out=$(grep -rnE '[0-9]+ \* time\.(Milli)?[Ss]econd|[0-9]+ \* time\.Minute|[0-9]+ \* time\.Hour' --include='*.go' internal/ cmd/ | grep -v _test.go || true)
          echo "$out"
          count=$(printf '%s\n' "$out" | grep -c . || true)
          test "$count" -eq 15 || (echo "expected 15 mechanism lines, got $count"; exit 1)
          printf '%s\n' "$out" | grep -q "internal/relay/client.go" && (echo "policy literal in relay/client.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/relay/discovery.go" && (echo "policy literal in relay/discovery.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/relay/webhook.go" && (echo "policy literal in relay/webhook.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/relay/webhook_classify.go" && (echo "policy literal in relay/webhook_classify.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/router/loop.go" && (echo "policy literal in router/loop.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/router/router.go" && (echo "policy literal in router/router.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/router/modelbrowser.go" && (echo "policy literal in router/modelbrowser.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/router/recovery.go" && (echo "policy literal in router/recovery.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/router/usage.go" && (echo "policy literal in router/usage.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/loop/loop.go" && (echo "policy literal in loop/loop.go"; exit 1) || true
          printf '%s\n' "$out" | grep -q "internal/health/health.go" && (echo "policy literal in health/health.go"; exit 1) || true

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Shellcheck
        run: shellcheck install.sh scripts/install_test.sh scripts/backup-db.sh

      - name: Install script test
        run: sh scripts/install_test.sh
