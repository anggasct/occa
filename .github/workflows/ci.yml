name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: occa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || (echo "Unformatted files:"; echo "$unformatted"; exit 1)

      - name: Lint
        env:
          LINT_BASE_REV: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD^' }}
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --new-from-rev="$LINT_BASE_REV" ./...

      - name: Test (race)
        run: go test ./... -race -count=1

      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

      - name: Shellcheck
        run: shellcheck install.sh scripts/install_test.sh

      - name: Install script test
        run: sh scripts/install_test.sh
