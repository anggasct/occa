name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release assets
        run: |
          mkdir -p dist
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            os=${target% *}
            arch=${target#* }
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "dist/occa_${os}_${arch}" ./cmd/occa
          done

      - name: Verify asset names
        run: |
          for asset in occa_linux_amd64 occa_linux_arm64 occa_darwin_amd64 occa_darwin_arm64; do
            test -f "dist/$asset" || { echo "missing $asset" >&2; exit 1; }
          done

      - name: Smoke test linux asset
        env:
          OCCA_ADMIN_ID: smoke-test
        run: |
          if ./dist/occa_linux_amd64 >/dev/null 2>&1; then
            echo "expected startup to fail without bot tokens" >&2
            exit 1
          fi
          ./dist/occa_linux_amd64 2>&1 | grep -q "OCCA_TELEGRAM_TOKEN"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
