# OCCA example config — copy as starting template, then validate with:
#   occa webhooks check-config --config <path>
# Every key below is required when its section is used (fail-closed: a missing
# or unknown key refuses startup naming the block and key). Bot tokens are
# env-only (OCCA_TELEGRAM_TOKEN / OCCA_DISCORD_TOKEN) and never belong here.
agent:
  binary: opencode # agent backend executable spawned per working directory
  port_range: 4096-4116 # TCP port pool for agent instances
  max_instances: 5 # max concurrent agents; idle LRU evicted past this
  idle_timeout: 20m # reap agents idle longer than this
  default_workdir: "~" # fallback session working directory
  auto_install: false # auto-install the agent binary when missing
database:
  path: ~/.occa/occa.db # SQLite store file (sessions, channels, schedules)
logging:
  format: text # text or json log encoding
discord:
  allowed_sender_ids: # Discord user IDs allowed to reach OCCA (deny-by-default)
    - '<discord-user-id>'
telegram:
  allowed_sender_ids: # Telegram user IDs allowed to reach OCCA (deny-by-default)
    - '<telegram-user-id>'
webhooks:
  bind: 127.0.0.1:8787 # loopback-only listen address (must stay loopback)
  policy:
    trust_review_logins: [] # logins whose own `commented` review counts as verdict
    verdicts:
      approved: ['approved'] # comment phrases mapping to an approved verdict
      request_changes: ['request changes', 'request_changes'] # ... to request_changes
  runtime:
    max_body_size: 10MB # reject larger webhook payloads with 413
    max_concurrent_events: 16 # global executing-delivery semaphore size
    max_queued_per_key: 8 # per-identity queue budget; lanes share it, overflows answer 429
    state_lane_max_share: 0.5 # max share of the budget state events may occupy (0 < share <= 1)
    priority_overflow: 8 # extra slots a verdict/fix may borrow when the budget is full (>= 0)
    replay_store_max: 200 # rejected deliveries retained for automatic replay
    replay_store_max_bytes: 64MB # total body bytes retained by the replay store
    replay_interval: 30s # how often pending rejected deliveries are reconsidered
    replay_backoff: [30s, 2m, 10m] # delays between replay attempts
    replay_max_attempts: 3 # replay attempts before a delivery is declared lost
    replay_ttl: 30m # how long a rejected delivery stays replayable
    processing_timeout: 30m # per-delivery executor deadline
    claim_grace: 32m # stale-claim reclaim and restart-recovery window
    retry_after: 30s # Retry-After seconds sent with queue-full 429s
    workspace_retry_backoff: [30s, 60s, 120s] # retry delays for leased/dirty workspaces
    retention: 720h # prune delivery rows older than this
    retention_keep: 500 # always keep this many recent deliveries per prune
    prune_interval: 10m # delivery prune and workspace reap cadence
    dispatcher_idle_ttl: 1h # evict per-key dispatchers idle longer than this
    dispatcher_stuck_after: 5m # flag a started-but-unfinished delivery stuck past this
    watchdog_interval: 1m # how often the dispatcher watchdog sweeps for stuck keys
    http_read_header_timeout: 10s # max time reading request headers
    http_read_timeout: 30s # max time reading the full request
    http_write_timeout: 30s # max time writing the response
    http_idle_timeout: 2m # keep-alive idle timeout
    review_dedupe_window: 60m # duplicate pull_request_review suppression window
    isolated_workspace_ttl: 24h # expiry for explicitly isolated endpoints; the review lane uses 2h
    ack_budget: 1500ms # handler wait for the delivery-row insert before spooling; 0 = default
    reconcile_interval: 2m # stalled-PR reconciliation cadence; 0 = default
    reconcile_floor: 10m # minimum gap between reconcile enqueues for one PR/head/lane
    reconcile_max_prs: 25 # bound PRs examined per reconcile tick
    spool_dir: ~/.occa/spool # durable overflow spool for deliveries that miss the ACK budget
  dispatch: # task entry API (disabled unless enabled: true)
    enabled: false # POST /dispatch with bearer-token auth; relay posts a 2-line summary + thread
    path: /dispatch # API route suffix (must not collide with an endpoint path)
    token: <your-dispatch-token> # or OCCA_DISPATCH_TOKEN env; never commit a real token
  status_icons: # living task-parent icons by status (defaults shown; change without rebuilding)
    dispatched: ⏳ # task accepted, waiting for first event
    claimed: 👀 # review workflow claimed the task
    pr_opened: 🔨 # fix/merge workflow opened a PR
    merged: ✅ # merged workflow closed the task
    event: 📨 # generic webhook event line
    failed: ❌ # delivery failed (re-dispatch returns to ⏳)
    queued: ⏳ # phase: PR accepted, waiting for its turn
    dispatch: 🛠️ # phase: dispatch task running on the PR branch
    review: 👀 # phase: review run active
    fix: 🔨 # phase: fix run active
    merge: 🔀 # phase: merge run or merge gate active
    blocked: 🔴 # phase: operator action required
  status_colors: # embed color per status, as 24-bit decimal (text cards carry the icon; embeds consume the color)
    dispatched: 3447003 # blue
    claimed: 3447003 # blue
    pr_opened: 3066993 # green
    merged: 10157982 # purple
    event: 9807270 # grey
    failed: 15158332 # red
  fallback_poll_after: 10m # no event this long after dispatch/delivery -> one `gh pr list` poll for the branch
  defaults:
    comment_trigger:
      review: ['please re-review'] # default re-review phrase; override per repo
      fix: ['please fix review', 'please fix ci'] # default fix phrases; override per repo
    limits:
      max_runs_per_pr: 3 # comment-trigger runs allowed per PR per window
      window: 60m # sliding window for the trigger cap
    thread: true # dispatch deliveries run in the PR thread
    escalation_mention: operator # user or role mentioned when a PR queue blocks on retry exhaustion; empty disables the mention
    verbose_steps: false # per-step tool lines in the PR thread; off by default, a run posts one tool summary
    status_icons: # phase icons of the operator surface (overrides webhooks.status_icons)
      queued: ⏳ # phase: PR accepted, waiting for its turn
      dispatch: 🛠️ # phase: dispatch task running on the PR branch
      review: 👀 # phase: review run active
      fix: 🔨 # phase: fix run active
      merge: 🔀 # phase: merge run or merge gate active
      blocked: 🔴 # phase: operator action required
  repos:
    - repo: acme/widget # owner/name; expands to github-widget-{review,pr-fix,merge,merged}
      provider: github # only github is supported
      platform: discord # where runs and audit cards go: discord | telegram
      channel_id: '<channel-id>' # destination chat for runs and audit cards
      secret: <your-webhook-secret> # one secret shared by the 4 hooks
      checkout: /home/operator/projects/widget # required checkout root; review snapshots and fix branch worktrees live under it
      # model: openai/gpt-4o # optional per-repo model override
      # comment_trigger: # optional per-workflow phrases merged with the defaults (review and fix only)
      #   review: ['please re-review']
      # automation: # optional per-author policy (absent = review-only for everyone)
      #   default: review-only # full | review-only
      #   authors:
      #     owner-login: full
      # prompts: # optional per-workflow prompt override (absent = built-in default; file missing = startup error)
      #   review: { prompt_file: webhooks/saya-review.md } # or { prompt: "short instruction" }
      #   fix: { prompt_file: webhooks/saya-fix.md }
      #   merge: { prompt: "merge when green" }
      #   merged: { prompt_file: webhooks/saya-merged.md }
      # on_merged: [] # optional post-merge extras (default: just close the PR thread)
      # - prompt_file: "merged-vault.md" # one agent turn with your prompt file (stays in ~/.occa/webhooks, never in this repo)
      # - run: "make changelog" # one command, run with the repo checkout as cwd
      # on_merged: [] # optional post-merge extras: [{prompt: ...} | {prompt_file: ...} | {run: ...}]
  endpoints:
    - name: sentry-alerts # custom generic endpoints stay here; review/fix/merge/merged come from repos: above
      path: /webhooks/sentry-alerts # unique route suffix (no /occa prefix)
      auth: github_hmac_sha256 # "" | legacy_bearer | github_hmac_sha256
      secret: <your-webhook-secret> # credential verifying inbound requests
      workflow: custom # custom only; locked workflows are generated from repos:
      platform: telegram # where runs and audit cards go: discord | telegram
      channel_id: '<channel-id>' # destination chat for runs and audit cards
      prompt_file: webhooks/example-review.md # agent instruction file (exclusive with prompt)
      thread: true # run each delivery in its own thread
      workspace:
        type: none # none (no checkout) | git
      admit: # ordered admission rules; first match wins, no match = ignore
        - event: ping
# Required tuning: the network, durability, capacity and pagination values the
# binary sizes itself with. No built-in defaults, no fallbacks.
runtime:
  loop: # repeating-prompt loop bounds
    min_interval: 30s # smallest allowed interval between iterations
    max_interval: 1h # largest allowed interval between iterations
    max_duration: 4h # longest allowed time-based loop
    min_duration: 1m # shortest allowed time-based loop
    iteration_timeout: 10m # per-iteration execution deadline
    max_wall_age: 4h # wall-clock deadline for count-based loops
    min_count: 2 # smallest allowed repeat count
    max_count: 60 # largest allowed repeat count
    max_prompt_runes: 1000 # longest allowed loop prompt
    max_per_conversation: 1 # max concurrent loops per conversation
    max_global: 20 # max concurrent loops globally
  relay: # HTTP/SSE client to the agent backend
    discovery_timeout: 5s # fetching the agent OpenAPI discovery document
    client_timeout: 3m # agent relay HTTP requests
    max_attachment_size: 10MB # largest attachment payload accepted
    max_event_line_bytes: 1114112 # longest SSE line accepted
    webhook_abort_timeout: 5s # aborting the agent session after a failure
    verify_timeout: 15s # verifying the completed reply after a webhook turn
    stall_freshness: 2m # stream silence marking stall vs long generation
    no_event_timeout: 15m # SSE streams silent longer than this time out
  router: # command dispatch, pickers, recovery
    context_stale_after: 15m # cached context older than this counts as stale
    progress_quiet_threshold: 90s # silence before a progress notice is sent
    progress_stalled_after: 5m # silence without agent output before the notice reports STALLED
    max_queued_messages: 5 # messages buffered per conversation while busy
    max_picker_sessions: 6 # sessions listed per picker page
    max_picker_pages: 5 # picker result pages
    model_browser_ttl: 30m # model-picker callback token lifetime
    model_browser_page: 10 # models listed per browser page
    model_browser_nav_rows: 100 # button rows for browser navigation controls
    model_browser_cap: 1000 # stored tokens; oldest evicted past this
    agent_browser_ttl: 30m # agent-picker callback token lifetime
    agent_browser_cap: 256 # stored tokens; oldest evicted past this
    question_tombstone_ttl: 10m # answered-question record retention
    permission_tombstone_ttl: 10m # resolved-permission record retention
    attribution_ttl: 30s # schedule fingerprint-to-conversation entry lifetime
    recovery_budget: 60s # total deadline for an agent recovery attempt
    recovery_base_backoff: 10s # first retry delay after a recovery failure
    recovery_max_backoff: 40s # largest retry delay after a recovery failure
    usage_page_size: 5 # usage breakdown rows per page
    usage_default_window: 168h # default usage query lookback
  channels:
    discord:
      download_timeout: 60s # Discord attachment downloads
      max_download_size: 10MB # largest Discord download accepted
      task_thread_poll_interval: 300ms # wait between task-thread registry polls on claim
      task_thread_poll_attempts: 10 # registry polls before giving up on an in-flight dispatch thread
    telegram:
      download_timeout: 60s # Telegram file downloads
      max_download_size: 10MB # largest Telegram download accepted
      init_timeout: 15s # per-attempt Telegram bot client creation
      init_attempts: 3 # Telegram bot init retries
  mcp: # MCP server socket bounds
    read_header_timeout: 10s # reading HTTP request headers
    read_timeout: 30s # reading the full request
    write_timeout: 5m # writing streaming responses (kept generous for SSE)
    idle_timeout: 2m # idle keep-alive connections
  process: # agent subprocess lifecycle
    readiness_timeout: 30s # waiting for the agent health endpoint
    stop_grace: 5s # grace before SIGKILL when stopping
    control_timeout: 2s # per-probe timeout while polling readiness
  scheduler:
    stop_grace: 5s # grace before cancelling running scheduled jobs
  health:
    probe_timeout: 1500ms # per-probe health-check deadline
  store:
    usage_retention: 2160h # prune usage snapshots older than this
    usage_max_rows: 100000 # most usage projection rows retained
    recovery_event_retention: 720h # prune recovery events older than this
